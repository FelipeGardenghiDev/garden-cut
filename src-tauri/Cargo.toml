[package]
name = "gardencut"
version = "0.1.0"
description = "GardenCut - Editor de Vídeos Estilo CapCut Gratuito para PC"
edition = "2021"

[lib]
name = "gardencut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
